[data-theme="dark"][data-env="osobni"]{--accent:#4CC08E;--accent-ink:#04170F;--accent-soft:#12332A;--band:#071613;--band-2:#0F2620;--band-line:#1E4038}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- kostra ---------- */
.app{min-height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr}
.rail{background:var(--band);color:var(--band-ink);padding:12px 16px;display:grid;gap:12px;grid-template-columns:1fr auto;align-items:center}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.tally{width:12px;height:12px;border-radius:50%;background:var(--band-line);flex:none}
.tally.on{background:#FF3B30;box-shadow:0 0 0 4px rgba(255,59,48,.25)}
.envsw{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;background:var(--band-2);border:1px solid var(--band-line);border-radius:var(--r2);padding:4px;gap:4px}
.envsw button{border:0;background:transparent;color:var(--band-muted);border-radius:7px;padding:8px 10px;text-align:left;line-height:1.25;min-height:52px}
.envsw button b{display:block;color:inherit;font-size:16px}
.envsw button span{font-size:14px}
.envsw button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.nav{display:none}
.score{display:none}
.iconbtn{border:1px solid var(--band-line);background:transparent;color:var(--band-ink);border-radius:var(--r2);min-height:44px;padding:0 14px}
.rail .onlywide{display:none}

main{padding:20px 16px 112px;max-width:1180px;width:100%;margin:0 auto;min-width:0}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{border:0;background:transparent;color:var(--muted);min-height:52px;border-radius:var(--r2);font-size:15px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.tabbar .plus{background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;line-height:1;width:56px;height:56px;border-radius:50%;justify-self:center;margin-top:-18px;box-shadow:0 0 0 5px var(--surface)}

@media(min-width:900px){
  .app{grid-template-columns:272px 1fr;grid-template-rows:1fr}
  .rail{position:sticky;top:0;height:100dvh;padding:22px 18px;grid-template-columns:1fr;align-content:start;gap:20px;overflow:auto}
  .rail .onlynarrow{display:none}
  .rail .onlywide{display:block}
  .nav{display:grid;gap:2px}
  .nav button{border:0;background:transparent;color:var(--band-muted);text-align:left;padding:10px 12px;border-radius:var(--r2);min-height:44px;display:flex;justify-content:space-between;align-items:center}
  .nav button:hover{color:var(--band-ink);background:var(--band-2)}
  .nav button[aria-current="page"]{color:var(--band-ink);background:var(--band-2);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
  .nav .count{font-size:15px;color:var(--band-muted);font-weight:400}
  .score{display:block;border-top:1px solid var(--band-line);padding-top:16px;color:var(--band-muted);font-size:15px;line-height:1.45}
  .score b{color:var(--band-ink);font-size:17px}
  .xpbar{height:6px;background:var(--band-2);border-radius:3px;margin:8px 0 10px;overflow:hidden}
  .xpbar i{display:block;height:100%;background:var(--accent)}
  .tabbar{display:none}
  main{padding:34px 40px 64px}
}

/* ---------- společné prvky ---------- */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head h1{font-size:30px;line-height:1.1;letter-spacing:-.02em}
.head p{color:var(--muted)}
@media(min-width:900px){.head h1{font-size:42px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.panel>h2{font-size:20px;line-height:1.25;margin-bottom:12px}
.panel .sub{color:var(--muted);font-size:15px;margin:-8px 0 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);min-height:44px;padding:0 16px;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.btn.danger{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:44px;padding:0 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);min-height:44px;padding:8px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);line-height:1.2}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.empty{color:var(--muted);padding:6px 0 2px}

/* ---------- Dnes ---------- */
.prompter{background:var(--band);color:var(--band-ink);border-radius:var(--r2);padding:22px 20px;margin-bottom:22px}
.prompter blockquote{margin:0;font-size:21px;line-height:1.4;max-width:62ch;text-wrap:pretty}
.prompter .why{color:var(--band-muted);margin-top:12px;max-width:68ch}
.prompter .src{color:var(--band-muted);font-size:15px;margin-top:14px}
.prompter .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.prompter .btn{background:transparent;border-color:var(--band-line);color:var(--band-ink);font-weight:400}
.prompter .btn:hover{border-color:var(--band-ink)}
@media(min-width:900px){.prompter{padding:30px 34px}.prompter blockquote{font-size:26px;line-height:1.34}}

.cols{display:grid;gap:22px}
@media(min-width:1040px){.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:22px;min-width:0}

.quick{display:grid;grid-template-columns:1fr 92px auto;gap:8px;margin-bottom:8px}
.quick .btn{padding:0 14px}
@media(max-width:520px){.quick{grid-template-columns:1fr 84px}.quick .btn{grid-column:1/-1}}

.rows{display:grid}
.row{display:grid;grid-template-columns:34px 54px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check::after{content:"";width:12px;height:7px;border-left:3px solid transparent;border-bottom:3px solid transparent;transform:rotate(-45deg) translate(1px,-1px)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"]::after{border-color:#fff}
.row-time{font-weight:700;color:var(--ink)}
.row-time.none{color:var(--line)}
.row-main{border:0;background:transparent;text-align:left;padding:4px 0;min-width:0;display:grid;gap:2px}
.row-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.row-est{color:var(--muted);font-size:15px;white-space:nowrap}
.row-go{border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);min-height:40px;padding:0 12px;font-weight:700}
.row-go:hover{border-color:var(--accent);color:var(--accent)}
.row.is-done .row-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.row.is-done .row-go{visibility:hidden}
.row.is-live{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:var(--r2);border-top-color:transparent}
.row.is-live+.row{border-top-color:transparent}
.rowsum{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;color:var(--muted)}
.rowsum span{white-space:nowrap}
.rowsum b{color:var(--ink)}
@media(max-width:520px){
  .row{grid-template-columns:34px minmax(0,1fr) auto}
  .row-time{grid-column:2;grid-row:1;font-size:15px}
  .row-time.none{display:none}
  .row-main{grid-column:2}
  .row-est{grid-column:2;grid-row:auto}
  .row-go{grid-column:3;grid-row:1/span 3}
  .check{grid-row:1/span 3}
}

/* spínač */
.switch{display:grid;gap:16px;justify-items:start}
.switch .what{font-weight:700;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.switch label{display:grid;gap:6px;width:100%;color:var(--muted);font-size:15px}
.switch label input{color:var(--ink);font-size:17px}
.go{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring button,.ring .clock{position:absolute;inset:14px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:20px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.ring button:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.ring button small{display:block;font-size:14px;font-weight:400}
.ring .clock{font-size:28px;font-weight:700;background:var(--soft)}
.go .side{display:grid;gap:8px;max-width:30ch}
.go .side p{color:var(--muted);font-size:15px;line-height:1.4}
.go .side .btns{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.ring .prog{transition:none}}

/* ---------- lístky ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-items:start}
.board.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.note{background:var(--paper,#FFE873);color:var(--paper-ink);border:0;text-align:left;padding:14px 14px 12px;border-radius:2px;min-height:132px;display:grid;align-content:space-between;gap:12px;width:100%;
  box-shadow:0 1px 0 rgba(19,28,46,.18),0 10px 14px -10px rgba(19,28,46,.55)}
.note:nth-child(odd){transform:rotate(-.6deg)}
.note:nth-child(even){transform:rotate(.5deg)}
.note:hover,.note:focus-visible{transform:none}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;overflow:hidden}
.note .foot{font-size:14px;opacity:.78;display:flex;justify-content:space-between;align-items:end;gap:8px}
.note .foot span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .foot span:last-child{white-space:nowrap;flex:none}
.board.mini .note{min-height:104px;font-size:15px}
.board.mini .note .txt{-webkit-line-clamp:5}
.composer{display:grid;gap:10px;margin-bottom:22px}
.composer .line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.composer select{width:auto;max-width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid rgba(19,28,46,.25);background:var(--paper);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;margin-bottom:18px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;display:inline-flex;gap:8px;align-items:center}
.fchip i{width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid rgba(19,28,46,.3)}
.fchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.filters select{width:auto}

/* ---------- týden ---------- */
.weektools{display:flex;flex-wrap:wrap;gap:10px}
.week{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px;min-width:0;display:grid;gap:10px;align-content:start}
.day.today{border-color:var(--ink);box-shadow:inset 0 4px 0 var(--accent)}
.day header{display:grid;gap:4px}
.day h2{font-size:17px;line-height:1.25;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;align-items:baseline;white-space:nowrap}
.day h2 span{font-weight:400;color:var(--muted);font-size:15px;white-space:nowrap}
.load{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.load i{display:block;height:100%;background:var(--ink)}
.load.over i{background:var(--accent)}
.blks{display:grid;gap:6px}
.blk{border:0;text-align:left;background:var(--soft);border-left:5px solid var(--c,var(--muted));border-radius:var(--r1);padding:7px 9px;min-height:var(--h,48px);display:grid;align-content:start;gap:1px;width:100%;line-height:1.25}
.blk b{overflow-wrap:anywhere;font-size:15px}
.blk span{font-size:14px;color:var(--muted)}
.blk.done{opacity:.55}
.blk.done b{text-decoration:line-through}
.day .add{border:1px dashed var(--line);background:transparent;border-radius:var(--r1);min-height:40px;color:var(--muted);font-size:15px}
.day .add:hover{border-color:var(--ink);color:var(--ink)}
.weeksum{margin-top:16px;color:var(--muted)}
@media(min-width:900px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}.day{padding:10px}}

/* ---------- úkoly, nastavení ---------- */
.group{margin-top:22px}
.group>h2{font-size:17px;margin-bottom:4px;display:flex;gap:10px;align-items:baseline}
.group>h2 span{color:var(--muted);font-weight:400;font-size:15px}
.group.late>h2{color:var(--accent)}
.taskadd{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:760px){.taskadd{grid-template-columns:minmax(0,1fr) 170px 110px 190px auto}}
.settings{display:grid;gap:22px}
@media(min-width:1040px){.settings{grid-template-columns:1fr 1fr;align-items:start}}
.fieldrow{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:16px}
.kv dt{overflow-wrap:anywhere}.kv dd{margin:0;color:var(--muted);white-space:nowrap}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--muted)}
.steps li.done::before{content:"\2713";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li b{display:block;line-height:1.3}
.steps li span{color:var(--muted);font-size:15px}
.proj{margin-bottom:12px}
.proj summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center;gap:8px}
.proj ul{padding:4px 0 6px 18px;color:var(--muted);font-size:16px;columns:2;column-gap:20px}
.proj form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
.notice{border:1px solid var(--warn);color:var(--warn);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;font-size:16px}

/* ---------- dialog, toast ---------- */
dialog{border:0;border-radius:var(--r2);padding:0;width:min(580px,calc(100vw - 20px));background:var(--surface);color:var(--ink);max-height:calc(100dvh - 20px)}
dialog::backdrop{background:rgba(9,13,22,.6)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h2{font-size:22px;line-height:1.2}
.dlg label{display:grid;gap:5px;font-size:15px;color:var(--muted)}
.dlg label>*{color:var(--ink);font-size:17px}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:520px){.dlg .three{grid-template-columns:1fr 1fr}}
.dlg .hint{font-size:15px;color:var(--muted);margin-top:-8px}
.dlg .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:6px}
.dlg .foot div{display:flex;gap:8px}
.dlg .checkline{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:17px}
.dlg .checkline input{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);border-radius:var(--r2);padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;z-index:40;max-width:calc(100vw - 24px);box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.toast button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:var(--r1);min-height:38px;padding:0 12px;font-weight:700}
@media(min-width:900px){.toast{bottom:28px}}

.qr{background:#fff;padding:6px;border-radius:var(--r1);width:min(260px,100%);border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.rail [data-sync]{color:var(--band-muted)}

/* ---------- archiv ---------- */
.arbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media(max-width:760px){.arbar{grid-template-columns:1fr 1fr}.arbar input{grid-column:1/-1}}
.arbar select,.arbar input{width:100%}
.fchip .muted{color:var(--muted);font-weight:400}
.eps{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.eps li+li{border-top:1px solid var(--line)}
.ep{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 14px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px}
.ep:hover{background:var(--soft)}
.ep-date{color:var(--muted);font-size:15px;white-space:nowrap}
.ep-main{display:grid;gap:3px;min-width:0}
.ep-main b{overflow-wrap:anywhere;line-height:1.3}
@media(max-width:520px){.ep{grid-template-columns:1fr;padding:12px}.ep-date{font-size:14px}}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.tr{max-height:60vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.tr p{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:6px 0;line-height:1.45}
.tr .ts{font-weight:700;color:var(--accent);text-decoration:none;font-size:15px}
.tr a.ts:hover{text-decoration:underline}
#trsearch{margin-top:2px}
.menu{display:grid;gap:10px}
.menu button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:14px 16px;display:grid;gap:2px;min-height:64px}
.menu b{font-size:18px}.menu span{color:var(--muted);font-size:15px}
.head a{color:var(--ink)}

.motor{display:grid;grid-template-columns:1fr auto;gap:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* moduly */
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec-main{border:0;background:transparent;text-align:left;padding:4px 0;min-width:0;display:grid;gap:2px;color:inherit;font:inherit}
.rec-sub{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.rec.is-done .row-title{color:var(--muted);font-weight:400}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.checks.small{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tick{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);text-align:left;font:inherit;font-weight:700;color:var(--ink)}
.tick::before{content:"";flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px}
.tick[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.tick[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.tick:disabled{opacity:1;cursor:default}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekstrip button{display:grid;gap:2px;justify-items:center;min-height:52px;padding:6px 2px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font:inherit;color:var(--ink)}
.weekstrip button span{color:var(--muted);font-size:14px}
.weekstrip button b{font-size:15px;min-height:1.2em}
.weekstrip button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.weekstrip button:disabled{opacity:.45}
.dots{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:2px;background:var(--line);opacity:.5}
.dots i.l0{opacity:1}
.dots i.l1{opacity:1;background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.dots i.l2{opacity:1;background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dots i.l3{opacity:1;background:color-mix(in srgb,var(--accent) 80%,var(--line))}
.dots i.l4{opacity:1;background:var(--accent)}
.dots i.now{outline:2px solid var(--ink);outline-offset:1px}
.motto{font-size:clamp(22px,3.4vw,34px);font-weight:700;line-height:1.15;margin:0 0 22px;max-width:22ch;text-wrap:balance}
.h3{font-size:17px;margin:18px 0 0}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px 8px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl thead th{border-top:0;color:var(--muted);font-weight:400;font-size:15px}
.tbl tbody th{font-weight:400}
.spark{width:100%;height:auto;color:var(--accent)}
input[type=month]{font:inherit}
.fold summary{cursor:pointer;list-style-position:outside;margin-left:18px}
.fold summary h2{display:inline}
.fold[open] summary{margin-bottom:10px}
@media(max-width:520px){.weekstrip{gap:3px}.weekstrip button b{font-size:13px;white-space:nowrap}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile .big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.tile .spark{margin-top:10px}

</style>
</head>

<script>
(() => {
'use strict';

/* ================= pomůcky ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseYmd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d); };
const mondayOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const DAYS = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
const DAYS_SHORT = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
const MONTHS = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* Sloučení dvou stavů. Stejný kód běží v appce i v motoru.
   Záznam vyhrává podle novějšího času úpravy `u`; smazání je značka v `tomb`. */
function mergeState(a, b, now) {
  var NAMES = ['items', 'notes', 'projects', 'recs'];
  var KEEP = 180 * 24 * 3600 * 1000;
  var out = { cols: {}, tomb: {}, meta: null };
  var both = [a || {}, b || {}];
  NAMES.forEach(function (name) {
    var t = {}, m = {}, list = [], id;
    both.forEach(function (s) {
      var st = (s.tomb && s.tomb[name]) || {};
      for (var k in st) if (!(t[k] >= st[k])) t[k] = Number(st[k]) || 0;
      ((s.cols && s.cols[name]) || []).forEach(function (r) {
        if (!r || !r.id) return;
        var cur = m[r.id];
        if (!cur || (Number(r.u) || 0) > (Number(cur.u) || 0)) m[r.id] = r;
      });
    });
    for (id in m) { if (t[id] && t[id] >= (Number(m[id].u) || 0)) continue; list.push(m[id]); }
    for (id in t) if (now - t[id] > KEEP) delete t[id];
    out.cols[name] = list; out.tomb[name] = t;
  });

  out.meta = !ma ? (mb || null) : !mb ? ma : ((Number(mb.u) || 0) > (Number(ma.u) || 0) ? mb : ma);

}

function trLocal(id) {

const secs = t => t.split(':').reduce((a, x) => a * 60 + Number(x), 0);
const clock = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };

    const s = line.trim();

    else { cur = { t: null, text: s }; segs.push(cur); }

/* ---------- import z Notionu (CSV) ---------- */
function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;

const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const ymd3 = (y, m, d) => { y = +y; m = +m; d = +d; return y > 1990 && m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${y}-${pad(m)}-${pad(d)}` : ''; };

  s = String(s || '').split('→')[0].trim();
  let m;
  if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))) return ymd3(m[1], m[2], m[3]);
  if ((m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(s))) { const a = +m[1], b = +m[2]; return b > 12 && a <= 12 ? ymd3(m[3], a, b) : ymd3(m[3], b, a); }
  if ((m = /^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})/.exec(s))) return ymd3(m[3], MON[m[1].toLowerCase()], m[2]);
  if ((m = /^(\d{1,2})\.? ([A-Za-z]{3})[a-z]*\.?,? (\d{4})/.exec(s))) return ymd3(m[3], MON[m[2].toLowerCase()], m[1]);

}
const videoId = u => { const m = /(?:[?&]v=|youtu\.be\/|\/live\/|\/shorts\/|\/embed\/)([\w-]{11})/.exec(u || ''); return m ? m[1] : ''; };
const relNames = s => String(s || '').replace(/\s*\(https?:\/\/[^)]*\)/g, '').split(/,\s*/).map(x => x.trim()).filter(Boolean);

function placeFor(tag, channel, created) {
  const work = S.projects.filter(p => p.env === 'prace');
  const ts = aslug(tag);
  if (ts) for (const p of work) for (const t of p.types) if (aslug(t.name) === ts) return { projectId: p.id, typeId: t.id };
  const p = work.find(x => aslug(x.name) === aslug(channel));
  if (!p) return { projectId: '', typeId: '' };
  if (!ts) return { projectId: p.id, typeId: '' };
  const t = { id: `t-${aslug(p.name)}-${ts}`, name: tag };
  p.types.push(t); created.push(`${p.name} / ${tag}`);
  return { projectId: p.id, typeId: t.id };
}

function importNotion(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('Soubor je prázdný.');
  const head = rows[0].map(h => h.trim());
  const col = (...names) => { for (const n of names) { const i = head.findIndex(h => aslug(h) === aslug(n)); if (i >= 0) return i; } return -1; };
  const C = { name: col('Name', 'Název'), tag: col('Tags'), ch: col('Channel'), date: col('Publish Date'), url: col('URL'), people: col('Účastníci'), ep: col('Episode'), season: col('Season'), media: col('Media Type'), dur: col('Duration'), status: col('Status'), arch: col('Archive') };
  if (C.name < 0 || (C.tag < 0 && C.url < 0)) throw new Error('Tohle není export databáze Content. Chybí sloupce Name a Tags nebo URL.');
  const v = (r, k) => (C[k] >= 0 ? String(r[C[k]] || '').trim() : '');
  const created = [], out = [];
  let fresh = 0, updated = 0, skipped = 0;
  for (const r of rows.slice(1)) {
    const name = v(r, 'name');
    const status = v(r, 'status');
    if (!name || (status && aslug(status) !== 'completed') || /^(yes|ano|true)$/i.test(v(r, 'arch'))) { skipped++; continue; }
    const url = v(r, 'url'), vid = videoId(url), date = parseDate(v(r, 'date'));
    const id = vid ? `yt-${vid}` : `n-${hash(name + '|' + date).toString(36)}`;
    const place = placeFor(v(r, 'tag'), relNames(v(r, 'ch'))[0] || '', created);
    const media = MEDIA.find(m => m && aslug(m) === aslug(v(r, 'media'))) || '';
    const rec = { id, name, ...place, date, url, vid, ep: v(r, 'ep'), season: v(r, 'season'), media, dur: v(r, 'dur'), people: relNames(v(r, 'people')), notes: '', hasTr: false, src: 'notion' };
    const old = Arch.get(id);
    if (old) {
      for (const k of Object.keys(rec)) if (rec[k] === '' || (Array.isArray(rec[k]) && !rec[k].length)) rec[k] = old[k];
      rec.notes = old.notes || ''; rec.hasTr = !!old.hasTr; rec.trLen = old.trLen || 0;
      if (old.people && old.people.length && old.peopleEdited) { rec.people = old.people; rec.peopleEdited = true; }
      updated++;
    } else fresh++;
    out.push(rec);
  }
  if (created.length) save();
  const ok = Arch.putMany(out);
  return { fresh, updated, skipped, created, ok };
}

const kc = n => `${Math.round(+n || 0).toLocaleString('cs-CZ')} Kč`;

  const d = MODS[mod], st = d.status;
  return list.slice().sort((a, b) => (st ? st[1].indexOf(a[st[0]] || st[1][0]) - st[1].indexOf(b[st[0]] || st[1][0]) : 0)
    || (d.sortDesc ? String(b[d.sortDesc] || '').localeCompare(String(a[d.sortDesc] || ''), 'cs', { numeric: true }) : 0) || (b.created || 0) - (a.created || 0));
}

const dayRec = d => S.recs.find(r => r.id === 'den-' + d);

  for (const k of Object.keys(patch)) { if (patch[k] === '' || patch[k] == null) delete r[k]; else r[k] = patch[k]; }
}
const HEALTH = [['kroky', 'Kroky', v => Math.round(v).toLocaleString('cs-CZ')], ['spanek', 'Spánek', v => `${String(Math.round(v * 10) / 10).replace('.', ',')} h`], ['pripravenost', 'Oura', v => Math.round(v)], ['vaha', 'Váha', v => `${String(Math.round(v * 10) / 10).replace('.', ',')} kg`]];

  const t = today(), days = Array.from({ length: 14 }, (_, i) => addDays(t, -i));
  const have = days.some(d => dayRec(d));
  const w = S.recs.filter(r => r.mod === 'den' && r.vaha).sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
  let chart = '';
  if (w.length > 1) { const lo = Math.min(...w.map(r => +r.vaha)), hi = Math.max(...w.map(r => +r.vaha)), sp = (hi - lo) || 1;
    chart = `<svg class="spark" viewBox="0 0 300 70" role="img" aria-label="Váha, posledních ${w.length} vážení, od ${lo} do ${hi} kg"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${w.map((r, i) => `${(i / (w.length - 1) * 296 + 2).toFixed(1)},${(66 - (r.vaha - lo) / sp * 62).toFixed(1)}`).join(' ')}"/></svg>`; }
  return `<div class="head"><div><h1>Fitness</h1><p>Kroky, spánek a skóre z Oury, váha. Tréninky zůstávají v GymRatu.</p></div></div>

    <section class="panel"><h2>Zapsat den</h2>
      <form data-form="day-save" class="dlg" style="padding:0"><label>Den<input type="date" name="date" value="${t}" required></label>

      <div class="two"><label>Spánek v hodinách<input type="number" step="any" min="0" name="spanek"></label><label>Skóre z Oury<input type="number" min="0" max="100" name="pripravenost"></label></div>
      <p><button class="btn primary">Zapsat</button></p></form>
    </section>

      else S.notes.push({ id: uid(), env: r.env || S.env, text, color: 'zluta', projectId: '', typeId: '', created: Date.now() });
      r.stav = 'Vyřízené'; save(); closeDialog(); render(); toast(a === 'drop-task' ? 'Je z toho úkol.' : 'Je z toho lístek.', snap); break; }

/* ================= Čísla: YouTube kanály přes motor, ruční čísla (Herohero), čísla dílů =================
   Jedna metrika = jeden záznam v S.recs (mod cislo, id c-<klíč>), historie po dnech v `hist`: { den: [hlavní, zhlédnutí, videa] }. */
const D = () => S.dash;
const numRec = k => S.recs.find(r => r.id === 'c-' + k);
function numPut(k, vals, title) {
  let r = numRec(k);
  if (!r) { r = { id: 'c-' + k, mod: 'cislo', env: 'prace', k, hist: {}, created: Date.now() }; S.recs.push(r); }
  r.hist = { ...r.hist, [today()]: vals }; if (title) r.title = title;
}
const nf = n => Math.round(+n || 0).toLocaleString('cs-CZ');
function numAt(r, date, i) { const ds = Object.keys(r.hist).filter(d => d <= date).sort(); const d = ds[ds.length - 1]; return d ? r.hist[d][i] : null; }
function numDelta(r, days, i) {
  const now = numAt(r, today(), i), ds = Object.keys(r.hist).sort(), ref = addDays(today(), -days);
  if (now == null || !ds.length || ds[0] > ref) return '';
  const d = now - numAt(r, ref, i);
  return `${d > 0 ? '+' : d < 0 ? '−' : ''}${nf(Math.abs(d))} za ${days} dní`;
}

  const ds = Object.keys(r.hist).sort().slice(-60); if (ds.length < 3) return '';
  const v = ds.map(d => r.hist[d][0]), lo = Math.min(...v), sp = (Math.max(...v) - lo) || 1;
  return `<svg class="spark" viewBox="0 0 300 50" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${v.map((x, i) => `${(i / (v.length - 1) * 296 + 2).toFixed(1)},${(46 - (x - lo) / sp * 42).toFixed(1)}`).join(' ')}"/></svg>`;
}
const Num = {
  busy: false, error: '', last: 0,
  parse(s) { s = String(s).trim(); const m = /channel\/(UC[\w-]{22})/.exec(s) || /^(UC[\w-]{22})$/.exec(s) || /(@[\w.\-]{3,40})/.exec(s); return m ? m[1] : ''; },
  async refresh(force) {
    if (!Sync.cfg || this.busy || !D().channels.length || (!force && Date.now() - this.last < 3 * 3600e3)) return;
    this.busy = true; this.error = '';

      this.last = Date.now(); save();
    } catch (e) { this.error = e.message === 'yt-off' ? 'yt-off' : e.message === 'op' ? 'old' : 'net'; }
    this.busy = false; if (ui.view === 'cisla') softRender();

      const ch = eps.filter(r => res.videos[r.vid]).map(r => ({ ...r, yt: { ...res.videos[r.vid], at: today() } }));
      if (ch.length) Arch.putMany(ch);

    } catch (e) { this.error = e.message === 'yt-off' ? 'yt-off' : e.message === 'op' ? 'old' : 'net'; toast('Čísla dílů se nepodařilo načíst.'); }

    case 'num-set': if (v !== '') { numPut(f.dataset.k, [+v]); save(); render(); } break;
    case 'num-channel': { const k = Num.parse(v); if (!k) { toast('Tohle nevypadá jako kanál. Vlož adresu kanálu nebo @jmeno.'); break; } if (!D().channels.some(c => c.k === k)) S.dash = { ...D(), channels: [...D().channels, { k }] }; save(); render(); Num.refresh(true); break; }
    case 'num-manual': S.dash = { ...D(), manual: [...D().manual, { k: 'm' + uid(), name: v }] }; save(); render(); break;
  }
});


/* ================= vykreslení ================= */
function chip(it) { const l = itemLabel(it); return l ? `<span class="chip" style="--c:${l.color}"><i></i>${esc(l.text)}</span>` : ''; }

function rowHTML(it, showDate) {
  const live = S.run && S.run.id === it.id;
  const meta = [chip(it), it.kind !== 'ukol' ? `<span class="chip">${KIND[it.kind]}</span>` : '', it.recur ? `<span class="chip">Opakuje se ${recurText(it.recur)}</span>` : '', showDate && it.date ? `<span class="chip">${cap(fmtShort(it.date))}</span>` : ''].filter(Boolean).join('');
  const est = it.done && it.actual ? `${fmtMin(it.actual)} skutečně` : (it.est ? fmtMin(it.est) : 'bez odhadu');
  return `<li class="row${it.done ? ' is-done' : ''}${live ? ' is-live' : ''}" data-id="${it.id}">
    <button class="check" type="button" data-action="toggle" aria-pressed="${it.done ? 'true' : 'false'}" aria-label="${it.done ? 'Vrátit mezi nehotové' : 'Označit jako hotové'}: ${esc(it.title)}"></button>
    <span class="row-time${it.time ? '' : ' none'}">${it.time || '--:--'}</span>
    <button class="row-main" type="button" data-action="edit"><span class="row-title">${esc(it.title)}</span>${meta ? `<span class="row-meta">${meta}</span>` : ''}</button>
    <span class="row-est">${est}</span>
    <button class="row-go" type="button" data-action="start">${live ? 'Běží' : 'Start'}</button>
  </li>`;
}

function noteHTML(n) {
  const c = colorOf(n.color), p = project(n.projectId), tn = typeName(n.projectId, n.typeId);
  const where = p ? (tn && tn !== p.name ? tn : p.name) : '';
  const d = new Date(n.created);
  return `<button class="note" type="button" style="--paper:${c.hex}" data-action="note-edit" data-id="${n.id}">
    <span class="txt">${esc(n.text)}</span>
    <span class="foot"><span>${esc(where)}</span><span>${d.getDate()}. ${d.getMonth() + 1}.</span></span>
  </button>`;
}

function projectOptions(env, pid, tid) {
  const sel = `${pid || ''}|${tid || ''}`;
  let h = `<option value="|">Bez zařazení</option>`;
  for (const p of S.projects.filter(p => p.env === env)) {
    if (!p.types.length) { h += `<option value="${p.id}|"${sel === p.id + '|' ? ' selected' : ''}>${esc(p.name)}</option>`; continue; }
    h += `<optgroup label="${esc(p.name)}"><option value="${p.id}|"${sel === p.id + '|' ? ' selected' : ''}>${esc(p.name)} – celý projekt</option>`;
    for (const t of p.types) h += `<option value="${p.id}|${t.id}"${sel === `${p.id}|${t.id}` ? ' selected' : ''}>${esc(t.name)}</option>`;
    h += `</optgroup>`;
  }
  return h;
}

function viewDnes() {

  const th = thought();
  const cand = S.run ? S.items.find(i => i.id === S.run.id) : (S.items.find(i => i.id === ui.target && !i.done) || open[0] || late[0] || null);
  const notes = S.notes.filter(n => n.env === env).sort((a, b) => b.created - a.created).slice(0, 4);
  const sum = list.length
    ? `Na dnešek ${list.length} ${plural(list.length, 'věc', 'věci', 'věcí')}, dohromady ${fmtMin(planned)}. Hotovo ${doneN}.`

  const prompter = th ? `<section class="prompter" aria-label="Myšlenka dne">

        ${th.w ? `<button class="btn" type="button" data-action="thought-why" aria-expanded="${ui.why}">${ui.why ? 'Skrýt důvod' : 'Proč to funguje'}</button>` : ''}

      </div>
    </section>` : '';

  let sw;
  if (!cand) {
    sw = `<p class="empty">Přidej do plánu dne první věc. Spínač ti k ní nabídne pětiminutový start.</p>`;
  } else if (S.run) {
    sw = `<p class="what">${esc(cand.title)}</p>
      ${cand.firstStep ? `<p>První krok: ${esc(cand.firstStep)}</p>` : ''}

        <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="ringprog" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg><div class="clock" id="clock" role="timer">00:00</div></div>
        <div class="side"><p id="runnote">Stačí vydržet prvních pět minut.</p>
          <div class="btns"><button class="btn primary" type="button" data-action="run-done">Hotovo</button><button class="btn" type="button" data-action="run-stop">Přerušit</button></div></div>
      </div>`;
  } else {
    const u = usual(cand);
    sw = `<p class="what">${esc(cand.title)}</p>
      <label>První krok na 5 minut
        <input type="text" id="firststep" data-id="${cand.id}" value="${esc(cand.firstStep || '')}" placeholder="Například: otevřít projekt a pojmenovat soubor" autocomplete="off">
      </label>
      <div class="go">
        <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/></svg><button type="button" data-action="run-start" data-id="${cand.id}"><span>Start<small>5 minut</small></span></button></div>
        <div class="side"><p>${cand.est ? `Odhad ${fmtMin(cand.est)}.` : 'Bez odhadu času.'}${u ? ` Obvykle ti to trvá ${fmtMin(u.avg)} (${u.n}×).` : ''} Po pěti minutách se rozhodneš, jestli jedeš dál.</p></div>

  return `<div class="head"><div><h1>${cap(fmtDate(t))}</h1><p>${sum}</p></div></div>

  <div class="cols">

      <section class="panel">
        <h2>Plán dne</h2>
        <form class="quick" data-form="quick-item" autocomplete="off">
          <input type="text" name="title" placeholder="Co chceš dnes udělat" aria-label="Co chceš dnes udělat" required>
          <input type="number" name="est" min="1" max="1440" placeholder="min" aria-label="Odhad v minutách">
          <button class="btn primary">Přidat</button>
        </form>
        ${list.length ? `<ul class="rows">${list.map(i => rowHTML(i)).join('')}</ul>
        <p class="rowsum"><span>Zbývá <b>${fmtMin(open.reduce((s, i) => s + (i.est || 0), 0))}</b></span><span>Plán celkem <b>${fmtMin(planned)}</b></span></p>` : `<p class="empty">Zatím prázdno. Vysílání s časem přidáš přes Týden, rychlou věc tady nahoře.</p>`}
      </section>

    </div>

      <section class="panel"><h2>Spínač</h2><div class="switch">${sw}</div></section>
      ${m360Card()}
      <section class="panel"><h2>Poslední lístky</h2>
        ${notes.length ? `<div class="board mini">${notes.map(noteHTML).join('')}</div>` : `<p class="empty">Žádný lístek. Napiš první.</p>`}
        <p style="margin-top:14px"><button class="btn" type="button" data-action="note-new">Nový lístek</button></p>
      </section>
    </div>
  </div>`;

function viewTyden() {
  const start = ui.week, t = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const f = ui.weekFilter;
  const pick = d => S.items.filter(i => i.date === d && (f === 'vse' || i.env === f)).sort(bySlot);
  let tot = { prace: 0, osobni: 0 };
  const cols = days.map(d => {
    const list = pick(d);
    const mins = list.reduce((s, i) => s + (i.est || 0), 0);
    list.forEach(i => { tot[i.env] += i.est || 0; });
    const pct = Math.min(100, Math.round(mins / S.capacity * 100));
    return `<section class="day${d === t ? ' today' : ''}">
      <header><h2>${cap(fmtShort(d))}<span>${mins ? fmtMin(mins) : 'volno'}</span></h2>
        <div class="load${mins > S.capacity ? ' over' : ''}" role="img" aria-label="Zaplněno ${Math.round(mins / S.capacity * 100)} % dne"><i style="width:${pct}%"></i></div></header>
      ${list.length ? `<ul class="blks">${list.map(i => `<li><button type="button" class="blk${i.done ? ' done' : ''}" data-action="edit" data-id="${i.id}" style="--c:${itemColor(i)};--h:${Math.max(48, Math.min(200, Math.round((i.est || 0) * 0.75)))}px">
          <b>${i.time ? i.time + ' ' : ''}${esc(i.title)}</b><span>${i.est ? fmtMin(i.est) : 'bez odhadu'}${f === 'vse' ? ', ' + ENVS[i.env].sub : ''}</span></button></li>`).join('')}</ul>` : ''}
      <button type="button" class="add" data-action="item-new" data-date="${d}">Přidat</button>
    </section>`;
  }).join('');
  const a = parseYmd(days[0]), b = parseYmd(days[6]);
  const title = a.getMonth() === b.getMonth() ? `${a.getDate()}.–${b.getDate()}. ${MONTHS[b.getMonth()]}` : `${a.getDate()}. ${MONTHS[a.getMonth()]} – ${b.getDate()}. ${MONTHS[b.getMonth()]}`;
  const all = tot.prace + tot.osobni;
  return `<div class="head"><div><h1>Týden ${title}</h1><p>Plný den počítám jako ${fmtMin(S.capacity)}. Změníš v Nastavení.</p></div>
    <div class="weektools">
      <div class="seg" role="group" aria-label="Posun týdne"><button type="button" data-action="week" data-step="-1" aria-pressed="false">Předchozí</button><button type="button" data-action="week" data-step="0" aria-pressed="${start === mondayOf(t)}">Tento</button><button type="button" data-action="week" data-step="1" aria-pressed="false">Další</button></div>
      <div class="seg" role="group" aria-label="Co zobrazit">${[['vse', 'Vše'], ['prace', 'Práce'], ['osobni', 'Osobní']].map(([k, l]) => `<button type="button" data-action="weekfilter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
    </div></div>
  <div class="week">${cols}</div>
  <p class="weeksum">${all ? `Naplánováno ${fmtMin(all)}: práce ${fmtMin(tot.prace)}, osobní ${fmtMin(tot.osobni)}.` : 'Tenhle týden je prázdný. Začni vysíláními, pak přidej fitko.'}</p>`;
}

function viewUkoly() {
  const env = S.env, t = today(), weekEnd = addDays(t, 7);
  const mine = S.items.filter(i => i.env === env);
  const open = mine.filter(i => !i.done);
  const G = [
    ['Po termínu', open.filter(i => i.date && i.date < t), 'late'],
    ['Dnes', open.filter(i => i.date === t), ''],
    ['Dalších 7 dní', open.filter(i => i.date > t && i.date <= weekEnd), ''],
    ['Později', open.filter(i => i.date > weekEnd), ''],
    ['Bez data', open.filter(i => !i.date), '']
  ];
  const done = mine.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 40);
  const groups = G.filter(g => g[1].length).map(([name, arr, cls]) => `<section class="group ${cls}"><h2>${name}<span>${arr.length}, ${fmtMin(arr.reduce((s, i) => s + (i.est || 0), 0))}</span></h2>
    <div class="panel"><ul class="rows">${arr.sort((a, b) => (a.date || '').localeCompare(b.date || '') || bySlot(a, b)).map(i => rowHTML(i, true)).join('')}</ul></div></section>`).join('');
  return `<div class="head"><div><h1>Úkoly</h1><p>${ENVS[env].name}. Otevřených ${open.length}.</p></div></div>
  <section class="panel">
    <form class="taskadd" data-form="task-add" autocomplete="off">
      <input type="text" name="title" placeholder="Nový úkol" aria-label="Nový úkol" required>
      <input type="date" name="date" aria-label="Datum" value="${t}">
      <input type="number" name="est" min="1" max="1440" placeholder="min" aria-label="Odhad v minutách">
      <select name="recur" aria-label="Opakování"><option value="">Neopakuje se</option><option value="1d">Každý den</option><option value="1w">Každý týden</option><option value="2w">Každé 2 týdny</option><option value="1m">Každý měsíc</option></select>
      <button class="btn primary">Přidat úkol</button>
    </form>
  </section>
  ${groups || `<p class="empty" style="margin-top:18px">Nic otevřeného. Přidej první úkol nahoře.</p>`}
  ${done.length ? `<section class="group"><h2>Hotovo<span>${done.length}</span> <button class="btn quiet" type="button" data-action="toggle-done">${ui.showDone ? 'Skrýt' : 'Zobrazit'}</button></h2>
    ${ui.showDone ? `<div class="panel"><ul class="rows">${done.map(i => rowHTML(i, true)).join('')}</ul></div>` : ''}</section>` : ''}`;
}

      </section>
      <section class="panel"><h2>Co je hotové a co přijde</h2>
        <ol class="steps">${SLICES.map(([n, d, ok]) => `<li class="${ok ? 'done' : ''}"><div><b>${n}</b><span>${d}</span></div></li>`).join('')}</ol>
      </section>
    </div>
  </div>`;
}

const VIEWS = { dnes: viewDnes, tyden: viewTyden, ukoly: viewUkoly, listky: viewListky, nastaveni: viewNastaveni, archiv: viewArchiv, dil: viewDil, vice: viewVice, schranka: () => viewMod('schranka'), mod: () => viewMod(), moduly: viewModuly, m360: view360, fitness: viewFitness, cisla: viewCisla };
const navList = () => [['dnes', 'Dnes'], ['tyden', 'Týden'], ['ukoly', 'Úkoly'], ['listky', 'Lístky'], ['schranka', 'Schránka'], ...(S.env === 'prace' ? [['archiv', 'Archiv'], ['cisla', 'Čísla']] : [['m360', 'MEDIUM 360'], ['moduly', 'Moduly']]), ['nastaveni', 'Nastavení']];
const navOf = v => v === 'dil' ? 'archiv' : (v === 'mod' || v === 'fitness') ? 'moduly' : v;

function applyTheme() {
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.env = S.env;
  const m = $('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--band').trim();
}

function render() {
  applyTheme();
  const env = S.env, t = today();
  const openToday = S.items.filter(i => i.env === env && !i.done && i.date && i.date <= t).length;
  const noteN = S.notes.filter(n => n.env === env).length;
  const counts = { dnes: openToday || '', listky: noteN || '', ukoly: S.items.filter(i => i.env === env && !i.done).length || '', archiv: (env === 'prace' && Arch.list().length) || '', schranka: inboxNew() || '' };
  if (env !== 'prace' && (ui.view === 'archiv' || ui.view === 'dil')) ui.view = 'dnes';
  if (env !== 'prace' && ui.view === 'cisla') ui.view = 'dnes';
  if (env !== 'osobni' && ['m360', 'moduly', 'fitness', 'mod'].includes(ui.view)) ui.view = 'dnes';
  const cur = navOf(ui.view);
  $('#envsw').innerHTML = Object.entries(ENVS).map(([k, e]) => `<button type="button" role="tab" data-action="env" data-env="${k}" aria-selected="${env === k}"><b>${e.name}</b><span>${e.sub}</span></button>`).join('');
  $('#nav').innerHTML = navList().map(([k, l]) => `<button type="button" data-action="nav" data-view="${k}"${cur === k ? ' aria-current="page"' : ''}>${l}${counts[k] ? `<span class="count">${counts[k]}</span>` : ''}</button>`).join('');
  $('#tabbar').innerHTML = [['dnes', 'Dnes'], ['tyden', 'Týden']].map(([k, l]) => `<button type="button" data-action="nav" data-view="${k}"${ui.view === k ? ' aria-current="page"' : ''}>${l}</button>`).join('')
    + `<button type="button" class="plus" data-action="note-new" aria-label="Nový lístek">+</button>`
    + [['ukoly', 'Úkoly'], ['vice', 'Další']].map(([k, l]) => `<button type="button" data-action="nav" data-view="${k}"${cur === k || (k === 'vice' && ['listky', 'archiv', 'nastaveni', 'schranka', 'm360', 'moduly', 'cisla'].includes(cur)) ? ' aria-current="page"' : ''}>${l}</button>`).join('');
  const xp = S.game.xp, st = streak();
  $('#score').innerHTML = `<b>Úroveň ${level()}</b><div class="xpbar" role="img" aria-label="${xp % 100} ze 100 bodů do další úrovně"><i style="width:${xp % 100}%"></i></div>${xp} bodů celkem<br>${st ? `${st} ${plural(st, 'den', 'dny', 'dní')} v řadě` : 'Dnes ještě nic hotového'}<br><span data-sync>${esc(Sync.text())}</span>`;
  $('#tally').classList.toggle('on', !!S.run);
  $('#view').innerHTML = (VIEWS[ui.view] || viewDnes)();
  if (ui.view === 'dil') loadTranscript();
  clearInterval(tick);
  if (S.run) { paintTimer(); tick = setInterval(paintTimer, 1000); }
}

/* ================= dialogy ================= */
const dlg = () => $('#dlg');
function openDialog(html) { const d = dlg(); d.innerHTML = html; if (!d.open) d.showModal(); const f = d.querySelector('[autofocus]'); if (f) f.focus(); }
function closeDialog() { const d = dlg(); if (d.open) d.close(); d.innerHTML = ''; }

function itemDialog(it, isNew) {
  const u = usual(it);
  const r = it.recur ? `${it.recur.every}${it.recur.unit}` : '';
  const kinds = it.env === 'prace' ? ['vysilani', 'ukol', 'blok'] : ['ukol', 'blok'];
  openDialog(`<form class="dlg" data-form="item-save" data-id="${isNew ? '' : it.id}" autocomplete="off">
    <h2>${isNew ? 'Nová věc v plánu' : 'Upravit'}</h2>
    <label>Název<input type="text" name="title" value="${esc(it.title)}" required ${isNew ? 'autofocus' : ''}></label>
    <div class="two">
      <label>Prostředí<select name="env" data-change="dlg-env">${Object.entries(ENVS).map(([k, e]) => `<option value="${k}"${it.env === k ? ' selected' : ''}>${e.name}</option>`).join('')}</select></label>
      <label>Druh<select name="kind">${kinds.map(k => `<option value="${k}"${it.kind === k ? ' selected' : ''}>${KIND[k]}</option>`).join('')}</select></label>
    </div>
    <label>Zařazení<select name="where">${projectOptions(it.env, it.projectId, it.typeId)}</select></label>
    <div class="three">
      <label>Datum<input type="date" name="date" value="${it.date || ''}"></label>
      <label>Čas<input type="time" name="time" value="${it.time || ''}"></label>
      <label>Odhad (min)<input type="number" name="est" min="1" max="1440" value="${it.est || ''}"></label>
    </div>
    ${u ? `<p class="hint">Obvykle ti to trvá ${fmtMin(u.avg)} (měřeno ${u.n}×).</p>` : ''}
    <label>První krok na 5 minut<input type="text" name="firstStep" value="${esc(it.firstStep || '')}" placeholder="Co uděláš jako úplně první"></label>
    <div class="two">
      <label>Opakování<select name="recur">${[['', 'Neopakuje se'], ['1d', 'Každý den'], ['2d', 'Každé 2 dny'], ['1w', 'Každý týden'], ['2w', 'Každé 2 týdny'], ['1m', 'Každý měsíc'], ['3m', 'Každé 3 měsíce']].map(([k, l]) => `<option value="${k}"${r === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Skutečný čas (min)<input type="number" name="actual" min="0" max="2880" value="${it.actual || ''}"></label>
    </div>
    <div class="foot">
      ${isNew ? '<span></span>' : '<button class="btn danger" type="button" data-action="item-delete" data-id="' + it.id + '">Smazat</button>'}
      <div><button class="btn" type="button" data-action="dlg-close">Zavřít</button><button class="btn primary">Uložit</button></div>
    </div>
  </form>`);
}

function noteDialog(n, isNew) {
  openDialog(`<form class="dlg" data-form="note-save" data-id="${isNew ? '' : n.id}">
    <h2>${isNew ? 'Nový lístek' : 'Lístek'}</h2>
    <label>Text<textarea name="text" required ${isNew ? 'autofocus' : ''} style="min-height:150px">${esc(n.text)}</textarea></label>
    <div class="swatches" role="group" aria-label="Barva lístku">${PAPER.map(c => `<button type="button" class="swatch" style="--paper:${c.hex}" data-action="dlg-color" data-color="${c.id}" aria-pressed="${n.color === c.id}" aria-label="${esc(colorName(c.id, n.env))}" title="${esc(colorName(c.id, n.env))}"></button>`).join('')}</div>
    <input type="hidden" name="color" value="${n.color}">
    <div class="two">
      <label>Prostředí<select name="env" data-change="dlg-env">${Object.entries(ENVS).map(([k, e]) => `<option value="${k}"${n.env === k ? ' selected' : ''}>${e.name}</option>`).join('')}</select></label>
      <label>Zařazení<select name="where">${projectOptions(n.env, n.projectId, n.typeId)}</select></label>
    </div>
    <div class="foot">
      ${isNew ? '<span></span>' : `<div><button class="btn danger" type="button" data-action="note-delete" data-id="${n.id}">Smazat</button><button class="btn" type="button" data-action="note-to-task" data-id="${n.id}">Udělat z něj úkol</button></div>`}
      <div><button class="btn" type="button" data-action="dlg-close">Zavřít</button><button class="btn primary">Uložit</button></div>
    </div>
  </form>`);
}

const blankItem = (over = {}) => ({ id: uid(), env: S.env, kind: S.env === 'prace' && over.time ? 'vysilani' : 'ukol', title: '', date: today(), time: '', est: 0, done: false, actual: 0, projectId: '', typeId: '', firstStep: '', recur: null, ...over });
const parseRecur = v => { const m = /^(\d+)([dwm])$/.exec(v || ''); return m ? { every: +m[1], unit: m[2] } : null; };

/* ================= události ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action;
  const rowEl = b.closest('[data-id]');
  const id = b.dataset.id || (rowEl && rowEl.dataset.id);
  const item = () => S.items.find(i => i.id === id);
  switch (a) {
    case 'env': S.env = b.dataset.env; ui.fColor = ''; ui.fProject = ''; ui.target = null; ui.why = false; save(); render(); break;
    case 'nav': ui.view = b.dataset.view; render(); window.scrollTo(0, 0); break;
    case 'theme': S.theme = b.dataset.t; save(); render(); break;
    case 'thought-next': S.skip[S.env] += 1; ui.why = false; save(); render(); break;
    case 'thought-why': ui.why = !ui.why; render(); break;
    case 'thought-save': { const th = thought(); if (!th) break; const snap = snapshot(); S.notes.push({ id: uid(), env: S.env, text: `${th.t}\n\n${th.s}`, color: 'modra', projectId: '', typeId: '', created: Date.now() }); save(); render(); toast('Myšlenka je mezi lístky.', snap); break; }
    case 'toggle': { const it = item(); if (!it) break; const snap = snapshot(); let msg;
      if (it.done) { it.done = false; msg = 'Vráceno mezi nehotové.'; }
      else { if (S.run && S.run.id === it.id) msg = stopRun(true); else msg = complete(it); }
      save(); render(); toast(msg, snap); break; }
    case 'edit': { const it = item(); if (it) itemDialog(it, false); break; }
    case 'start': { const it = item(); if (!it || it.done) break; if (S.run && S.run.id === it.id) break; ui.target = it.id; if (ui.view !== 'dnes') ui.view = 'dnes'; render(); const el = $('#firststep'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); break; }
    case 'run-start': { const fs = $('#firststep'); const it = S.items.find(i => i.id === b.dataset.id); if (it && fs) it.firstStep = fs.value.trim(); startRun(b.dataset.id); break; }
    case 'run-done': { const snap = snapshot(); const msg = stopRun(true); save(); render(); toast(msg, snap); break; }
    case 'run-stop': { const snap = snapshot(); const msg = stopRun(false); save(); render(); toast(msg, snap); break; }
    case 'item-new': itemDialog(blankItem({ date: b.dataset.date || today() }), true); break;
    case 'item-delete': { const snap = snapshot(); if (S.run && S.run.id === id) S.run = null; S.items = S.items.filter(i => i.id !== id); save(); closeDialog(); render(); toast('Smazáno.', snap); break; }
    case 'note-new': noteDialog({ id: '', env: S.env, text: '', color: ui.noteColor, projectId: '', typeId: '' }, true); break;
    case 'note-edit': { const n = S.notes.find(x => x.id === id); if (n) noteDialog(n, false); break; }
    case 'note-delete': { const snap = snapshot(); S.notes = S.notes.filter(x => x.id !== id); save(); closeDialog(); render(); toast('Lístek smazán.', snap); break; }
    case 'note-to-task': { const n = S.notes.find(x => x.id === id); if (!n) break; const snap = snapshot(); S.items.push(blankItem({ env: n.env, title: n.text.split('\n')[0].slice(0, 120), projectId: n.projectId, typeId: n.typeId })); save(); closeDialog(); render(); toast('Z lístku je úkol na dnešek. Lístek zůstal.', snap); break; }
    case 'pick-color': ui.noteColor = b.dataset.color; document.querySelectorAll('.composer .swatch').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.color === ui.noteColor))); break;
    case 'dlg-color': { const f = b.closest('form'); f.elements.color.value = b.dataset.color; f.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s === b))); break; }
    case 'fcolor': ui.fColor = b.dataset.color; render(); break;
    case 'week': { const st = +b.dataset.step; ui.week = st === 0 ? mondayOf(today()) : addDays(ui.week, 7 * st); render(); break; }
    case 'weekfilter': ui.weekFilter = b.dataset.f; render(); break;
    case 'toggle-done': ui.showDone = !ui.showDone; render(); break;
    case 'dlg-close': closeDialog(); break;
    case 'undo': { const t = $('#toast'); if (t._snap) { S = JSON.parse(t._snap); save(); render(); } t.hidden = true; break; }
    case 'sync-now': Sync.now(); break;
    case 'sync-off': Sync.disconnect(); render(); toast('Zařízení odpojeno. Data v něm zůstala.'); break;
    case 'show-link': { const box = $('#linkbox'); if (!box) break;
      const base = location.protocol === 'https:' ? location.origin + location.pathname : PUBLIC_URL;
      const link = `${base}#pripojit=${b64u.enc({ u: Sync.cfg.url, k: Sync.cfg.key })}`;
      let svg = '';
      try { const q = window.__qr(0, 'M'); q.addData(link); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 3, scalable: true }); } catch (err) { svg = ''; }
      box.innerHTML = `<p class="sub" style="margin:12px 0 8px">Naskenuj foťákem telefonu, nebo si odkaz pošli. Obsahuje klíč k tvým datům, nikomu dalšímu ho nedávej.</p>${svg ? `<div class="qr">${svg}</div>` : ''}<textarea readonly id="linktext" aria-label="Propojovací odkaz" style="margin-top:10px;min-height:84px;font-size:14px">${esc(link)}</textarea><p style="margin-top:8px"><button class="btn" type="button" data-action="copy-link">Zkopírovat odkaz</button></p>`;
      box.hidden = false; break; }
    case 'copy-link': { const ta = $('#linktext'); if (!ta) break; ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Odkaz je ve schránce.'), () => toast('Odkaz je označený. Zkopíruj ho ručně.')); break; }
    case 'export': { const blob = new Blob([JSON.stringify({ ...S, archive: Arch.recs }, null, 2)], { type: 'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = `asistent-zaloha-${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); break; }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), g = k => String(fd.get(k) ?? '').trim();
  const where = () => { const [p, t] = (g('where') || '|').split('|'); return { projectId: p || '', typeId: t || '' }; };
  switch (f.dataset.form) {
    case 'quick-item': { if (!g('title')) break; const it = blankItem({ title: g('title'), est: +g('est') || 0 }); if (!it.est) { const u = usual(it); if (u) it.est = Math.round(u.avg); } S.items.push(it); ui.target = ui.target || it.id; save(); render(); const i = $('[data-form="quick-item"] input[name=title]'); if (i) i.focus(); break; }
    case 'task-add': { if (!g('title')) break; const it = blankItem({ title: g('title'), date: g('date'), est: +g('est') || 0, recur: parseRecur(g('recur')) }); if (it.recur && !it.date) it.date = today(); S.items.push(it); save(); render(); break; }
    case 'item-save': {
      const id = f.dataset.id; const it = id ? S.items.find(i => i.id === id) : blankItem();
      if (!it) break;
      const was = it.actual || 0;
      Object.assign(it, { title: g('title'), env: g('env'), kind: g('kind'), date: g('date'), time: g('time'), est: +g('est') || 0, firstStep: g('firstStep'), recur: parseRecur(g('recur')), actual: +g('actual') || 0 }, where());
      if (it.recur && !it.date) it.date = today();
      if (it.env === 'osobni' && it.kind === 'vysilani') it.kind = 'ukol';
      if (!id) S.items.push(it);
      if (it.done && it.actual && it.actual !== was) learn(it);
      save(); closeDialog(); render(); break;
    }
    case 'note-add': { if (!g('text')) break; S.notes.push({ id: uid(), env: S.env, text: g('text'), color: ui.noteColor, created: Date.now(), ...where() }); save(); render(); break; }
    case 'note-save': {
      const id = f.dataset.id;
      if (id) { const n = S.notes.find(x => x.id === id); if (n) Object.assign(n, { text: g('text'), color: g('color'), env: g('env') }, where()); }
      else S.notes.push({ id: uid(), text: g('text'), color: g('color'), env: g('env'), created: Date.now(), ...where() });
      ui.noteColor = g('color'); save(); closeDialog(); render(); break;
    }
    case 'connect': { const cfg = parseLink(g('link')); if (!cfg) { toast('Tohle není propojovací odkaz. Zkopíruj ho celý z Tabulky.'); break; } Sync.connect(cfg); render(); Sync.now().then(() => { toast(Sync.error ? Sync.text() : 'Propojeno. Data se synchronizují.'); Sync.thoughts(); }); break; }
    case 'type-add': { const p = project(f.dataset.pid); if (p && g('name')) { p.types.push({ id: uid(), name: g('name') }); save(); render(); } break; }
    case 'project-add': { if (g('name')) { S.projects.push({ id: uid(), env: S.env, name: g('name'), color: '#6B7A90', types: [] }); save(); render(); } break; }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'firststep') { const it = S.items.find(i => i.id === el.dataset.id); if (it) { it.firstStep = el.value.trim(); save(); } return; }
  const c = el.dataset && el.dataset.change; if (!c) return;
  switch (c) {
    case 'fproject': ui.fProject = el.value === '|' ? '' : el.value; render(); break;
    case 'capacity': S.capacity = Math.max(60, Math.min(1440, +el.value || 480)); save(); break;
    case 'colorname': { const v = el.value.trim(); if (v) S.colorNames[S.env][el.dataset.color] = v; else delete S.colorNames[S.env][el.dataset.color]; save(); break; }
    case 'dlg-env': { const f = el.closest('form'); f.elements.where.innerHTML = projectOptions(el.value, '', ''); if (f.elements.kind) { const kinds = el.value === 'prace' ? ['vysilani', 'ukol', 'blok'] : ['ukol', 'blok']; const cur = f.elements.kind.value; f.elements.kind.innerHTML = kinds.map(k => `<option value="${k}"${cur === k ? ' selected' : ''}>${KIND[k]}</option>`).join(''); } break; }
    case 'import': { const file = el.files && el.files[0]; if (!file) break; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(String(r.result)); if (!d || !Array.isArray(d.items) || !Array.isArray(d.notes) || !Array.isArray(d.projects)) throw new Error('x'); const snap = snapshot(); const keep = { env: S.env, theme: S.theme }; const ar = d.archive; delete d.archive; S = { ...seed(), ...d, ...keep, v: 2 }; if (ar && typeof ar === 'object') Arch.putMany(Object.values(ar).filter(x => x && x.id)); if (!S.tomb || !S.tomb.items) S.tomb = { items: {}, notes: {}, projects: {}, recs: {} }; if (!S.tomb.recs) S.tomb.recs = {}; save(); render(); toast('Záloha nahraná.', snap); } catch (err) { toast('Tenhle soubor není záloha Asistenta. Nic se nezměnilo.'); } }; r.readAsText(file); break; }
  }
});

$('#dlg').addEventListener('click', e => { if (e.target === dlg()) closeDialog(); });
$('#dlg').addEventListener('close', () => { dlg().innerHTML = ''; if (pendingRender) softRender(); });
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (pendingRender) softRender(); }, 200); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') softRender(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) return; softRender(); Sync.now(); });
setInterval(() => { if (!document.hidden) Sync.now(); }, 60000);
window.addEventListener('online', () => Sync.now());

/* propojovací odkaz v adrese: uložit a z adresy hned odstranit */
function fromHash() {
  if (!/pripojit=/.test(location.hash)) return false;
  const cfg = parseLink(location.hash);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  if (!cfg) { setTimeout(() => toast('Propojovací odkaz je poškozený. Zkopíruj ho z Tabulky znovu.'), 400); return false; }
  Sync.connect(cfg); setTimeout(() => toast('Zařízení je propojené.'), 400);
  return true;
}
fromHash();
window.addEventListener('hashchange', () => { if (fromHash()) { render(); Sync.now().then(() => Sync.thoughts()); } });

/* první zápis zároveň ověří, jestli prohlížeč data drží */
persistOk = Store.write(S);
render();
Sync.now().then(() => Sync.thoughts());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
